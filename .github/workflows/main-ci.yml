name: Main CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  api-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependências da API
        working-directory: ./desafio-automacao-testes/02-testes-de-api
        run: npm install

      - name: Limpar relatórios antigos da API
        working-directory: ./desafio-automacao-testes/02-testes-de-api
        run: rm -rf playwright-report test-results

      - name: Executar testes de API
        working-directory: ./desafio-automacao-testes/02-testes-de-api
        run: npx playwright test

      - name: Upload do relatório da API
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-playwright-report
          path: |
            desafio-automacao-testes/02-testes-de-api/playwright-report
            desafio-automacao-testes/02-testes-de-api/test-results
          if-no-files-found: error

  e2e-tests:
    runs-on: ubuntu-latest
    needs: api-tests

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependências do E2E
        working-directory: ./desafio-automacao-testes/03-testes-e2e
        run: npm install

      - name: Instalar navegadores do Playwright
        working-directory: ./desafio-automacao-testes/03-testes-e2e
        run: npx playwright install --with-deps

      - name: Limpar relatórios antigos do E2E
        working-directory: ./desafio-automacao-testes/03-testes-e2e
        run: rm -rf playwright-report test-results

      - name: Executar testes E2E
        working-directory: ./desafio-automacao-testes/03-testes-e2e
        run: npx playwright test

      - name: Upload do relatório E2E
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-playwright-report
          path: |
            desafio-automacao-testes/03-testes-e2e/playwright-report
            desafio-automacao-testes/03-testes-e2e/test-results
          if-no-files-found: error

  relatorio-final:
    runs-on: ubuntu-latest
    needs: [api-tests, e2e-tests]
    if: always()

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Baixar relatórios dos jobs
        uses: actions/download-artifact@v4
        with:
          path: relatorios

      - name: Gerar resumo final do relatório
        shell: bash
        run: |
          mkdir -p relatorio-final

          find relatorios -mindepth 1 -maxdepth 1 -type d -exec cp -R {} relatorio-final/ \;

          cat > relatorio-final/index.html <<'EOF'
          <!doctype html>
          <html lang="pt-BR">
            <head>
              <meta charset="UTF-8" />
              <title>Relatório final de testes</title>
              <style>
                body { font-family: Arial, sans-serif; margin: 2rem; }
                ul { line-height: 1.8; }
                a { color: #0b57d0; }
              </style>
            </head>
            <body>
              <h1>Relatório final de testes</h1>
              <ul>
          EOF

          while IFS= read -r report_dir; do
            report_name="$(basename "$report_dir")"
            report_url="./${report_name}/playwright-report/index.html"
            echo "                <li><a href=\"${report_url}\">${report_name}</a></li>" >> relatorio-final/index.html
          done < <(find relatorio-final -mindepth 1 -maxdepth 1 -type d | sort)

          cat >> relatorio-final/index.html <<'EOF'
              </ul>
            </body>
          </html>
          EOF

      - name: Upload do relatório final
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-final
          path: relatorio-final
