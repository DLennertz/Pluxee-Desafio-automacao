name: Main CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  api-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependências da API
        working-directory: ./desafio-automacao-testes/02-testes-de-api
        run: npm install

      - name: Executar testes de API
        working-directory: ./desafio-automacao-testes/02-testes-de-api
        run: npx playwright test

  e2e-tests:
    runs-on: ubuntu-latest
    needs: api-tests

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependências do E2E
        working-directory: ./desafio-automacao-testes/03-testes-e2e
        run: npm install

      - name: Instalar navegadores do Playwright
        working-directory: ./desafio-automacao-testes/03-testes-e2e
        run: npx playwright install --with-deps

      - name: Executar testes E2E
        working-directory: ./desafio-automacao-testes/03-testes-e2e
        run: npx playwright test

  relatorio:
    runs-on: ubuntu-latest
    needs: [api-tests, e2e-tests]

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Upload dos relatórios
        uses: actions/upload-artifact@v4
        with:
          name: relatorios-de-testes
          path: |
            desafio-automacao-testes/02-testes-de-api/playwright-report
            desafio-automacao-testes/03-testes-e2e/playwright-report
